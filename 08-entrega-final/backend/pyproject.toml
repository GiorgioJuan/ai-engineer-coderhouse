[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panellab-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "redis>=5,<9",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "pypdf==6.12.2",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "langgraph-checkpoint-redis>=0.5,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fakeredis>=2.25,<3", "ruff>=0.14,<0.15"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W/F estilo y errores, I imports, B bugs probables, UP sintaxis moderna de 3.12,
# ASYNC llamadas bloqueantes dentro de async def, SIM simplificaciones.
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "SIM"]
# Depends()/Header()/Query() como valor por defecto es el patrón documentado de FastAPI.
ignore = ["B008"]
