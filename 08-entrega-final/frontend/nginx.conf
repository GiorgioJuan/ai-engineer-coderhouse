server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # DNS interno de Docker. Con el upstream en una variable, Nginx vuelve a resolver
    # "api" cuando el contenedor se recrea (por ejemplo tras `docker compose up --build`)
    # en lugar de quedarse con la IP vieja y responder 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
